name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # roda 1x por dia à meia-noite UTC
  workflow_dispatch:       # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # necessário para publicar os arquivos

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: angelicakadja
          outputs: dist/github-contribution-grid-snake.svg

      - name: Publish SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}